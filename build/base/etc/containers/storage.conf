# storage.conf for rootless CRI-O operation
[storage]
# Storage driver for rootless operation
driver = "overlay"

# Use container root user's home directory for storage
graphroot = "/root/.local/share/containers/storage"
# On tmpfs deliberately, and matching CRI-O's: runroot is per-boot state about
# running processes, so it has to go when they do. /run rather than /tmp,
# because systemd-tmpfiles-clean sweeps /tmp daily and deletes entries older
# than 10 days - including the state of containers that are still running. The
# reasoning and the incident are with the setting that governs the cluster's
# containers, in /etc/crio/crio.conf.d/04-rootless-storage.conf.
runroot = "/run/containers/storage"

[storage.options]
# Overlay storage options for rootless
mount_program = "/usr/bin/fuse-overlayfs"

[storage.options.overlay]
# Use fuse-overlayfs for rootless overlay
mountopt = "nodev,metacopy=on"
