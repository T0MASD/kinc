# CRI-O rootless storage configuration
[crio]
# Use container root user's home directory for rootless storage
root = "/root/.local/share/containers/storage"
# runroot stays on tmpfs, deliberately.
#
# It holds per-boot runtime state: container status, pidfiles, mountpoints and
# OCI bundles. That state describes processes, and processes do not survive the
# container restarting, so carrying it across a restart means podman and CRI-O
# start up believing in containers that are gone. That is a failure this
# codebase has already had elsewhere: stale running-container rows left the
# runtime refusing to initialise at all until the tables were pruned by hand.
#
# Erasing it on restart is the behaviour, not a limitation of where it lives.
#
# /run, not /tmp. Both are tmpfs and both give the per-boot semantics above, but
# /tmp is swept by systemd-tmpfiles-clean, which runs daily and deletes anything
# under it older than 10 days. That is not a reboot: it removes the runtime
# state of containers that are still running. Observed 2026-10-27 on a node up
# 12 days - CRI-O's own state dirs were gone, every container create failed with
#   cannot stat `/tmp/containers/overlay-containers/<id>`: No such file
# and /tmp measured 2.1MB across 910 inodes. Recovering it needed the affected
# pods recreated and, for static pods, CRI-O restarted - which in turn orphaned
# a running kube-apiserver still holding :6443.
#
# It fires on any node that stays up past the clean threshold, so it is a
# ten-day timer on every node, not a one-off.
runroot = "/run/containers/storage"

# Use fuse-overlayfs for rootless overlay storage
storage_driver = "overlay"
storage_option = [
    "overlay.mount_program=/usr/bin/fuse-overlayfs",
    "overlay.mountopt=nodev,metacopy=on"
]

# Where CRI-O writes a container's log when the caller does not name one.
#
# CRI-O's own default, rather than /tmp/crio-logs. The kubelet always passes an
# explicit path under /var/log/pods, so this directory stays empty in a running
# cluster - measured at 0 bytes on a live node - and it only takes a container
# created some other way, such as by crictl. Those are exactly the containers
# someone is debugging by hand, and on tmpfs their output did not survive the
# restart that usually follows.
log_dir = "/var/log/crio/pods"
