# CRI-O capabilities configuration
#
# CRI-O's own default, plus NET_ADMIN.
#
# A container that needs more asks for it in its securityContext, which works:
# a capability outside this list is still granted when a pod adds it
# explicitly, because the node holds the full set and CRI-O applies adds on top
# of this default.
#
# NET_ADMIN is here for upgrades, not because a container should have it. A
# cluster created before kinc-postinit.sh asked for it on kube-proxy's behalf
# has a DaemonSet that does not request it, and kinc-postinit.sh runs once, on
# the node that ran kubeadm init - so upgrading such a cluster's node image
# would leave kube-proxy unable to create its nftables table and the cluster
# without ClusterIP routing. Drop it from here once clusters have rolled
# through a release that patches the DaemonSet.
#
# What a container gets by default is not bounded by "rootless" - the node's own
# PID 1 holds all 41 capabilities inside its user namespace, so this list is a
# choice rather than a limit. It should stay the smallest one that works.
[crio.runtime]
default_capabilities = [
    "CHOWN",
    "DAC_OVERRIDE",
    "FSETID",
    "FOWNER",
    "SETGID",
    "SETUID",
    "SETPCAP",
    "NET_BIND_SERVICE",
    "KILL",
    "NET_ADMIN"
]
