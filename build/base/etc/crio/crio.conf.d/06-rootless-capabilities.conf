# CRI-O capabilities configuration
#
# CRI-O's own default, deliberately. A container that needs more asks for it in
# its securityContext, which works: a capability outside this list is still
# granted when a pod adds it explicitly, because the node holds the full set and
# CRI-O applies adds on top of this default.
#
# What a container gets by default is not bounded by "rootless" - the node's own
# PID 1 holds all 41 capabilities inside its user namespace, so this list is a
# choice rather than a limit. It should stay the smallest one that works.
[crio.runtime]
default_capabilities = [
    "CHOWN",
    "DAC_OVERRIDE",
    "FSETID",
    "FOWNER",
    "SETGID",
    "SETUID",
    "SETPCAP",
    "NET_BIND_SERVICE",
    "KILL"
]
