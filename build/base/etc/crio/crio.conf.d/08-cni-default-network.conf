# Name the network CRI-O must use, rather than letting it choose.
#
# Unset, CRI-O takes the first conflist in /etc/cni/net.d alphabetically. The
# directory holds 200-loopback.conflist, which CRI-O ships and which is a real,
# selectable network: it gives a pod a loopback interface and nothing else. So
# on a node where Antrea has not written 10-antrea.conflist yet, CRI-O selects
# loopback, reports "CNI plugin is now healthy", and the kubelet marks the node
# Ready. Pods are then created successfully with IP 127.0.0.1 and no route off
# the host, with no error anywhere:
#
#   Adding pod kinc-validation_xnode-client to CNI network "loopback"
#
# Named, CRI-O uses the Antrea network or none. Until the agent writes its
# config the plugin is not ready, the node is not Ready, and nothing is
# scheduled onto it - which is true, and which the node then recovers from.
[crio.network]
cni_default_network = "antrea"
