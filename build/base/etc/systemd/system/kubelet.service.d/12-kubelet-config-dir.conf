# Give the kubelet a config directory as well as a config file.
#
# kubeadm owns /var/lib/kubelet/config.yaml and rewrites it: on init, and again
# on join from the kubelet-config ConfigMap the control plane uploaded. Anything
# a node wants to say about itself has to survive both, and a drop-in under
# --config-dir is applied over that file, so it does.
#
# This overrides KUBELET_CONFIG_ARGS from 10-kubeadm.conf, which is upstream's
# file kept verbatim; a later drop-in is how it gets extended without editing it.
[Service]
Environment="KUBELET_CONFIG_ARGS=--config=/var/lib/kubelet/config.yaml --config-dir=/etc/kubernetes/kubelet.conf.d"
