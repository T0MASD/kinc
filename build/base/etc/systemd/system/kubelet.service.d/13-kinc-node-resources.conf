# The kubelet runs only with this node's reservations in place.
#
# kinc-node-resources renders systemReserved/kubeReserved before the kubelet
# reads its config directory, and REFUSES when the spec cannot work: a limit it
# cannot read, or a reserve at or above the limit. Its unit says
# Before=kubelet.service, and that only orders - it does not require. So a
# refusal used to leave the kubelet starting anyway, advertising every byte and
# core of the machine as schedulable, with the reason in a journal nobody
# opens, while deploy.sh reported success.
#
# Requires= makes the refusal stop the node instead: kubeadm's kubelet-start
# fails, kubeadm-init fails, and the deploy says so. Asking for no limits is
# still fine - the script exits 0 and reserves nothing.
#
# No deadlock: kinc-node-resources needs only the environment and /proc and is
# After=local-fs.target alone. It takes no dependency on kubeadm-init, which is
# what made Before=kubelet.service unsafe for kinc-faro-kubeconfig.
[Unit]
Requires=kinc-node-resources.service
After=kinc-node-resources.service
