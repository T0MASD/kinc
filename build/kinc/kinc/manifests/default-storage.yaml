
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: [ "" ]
    resources: [ "nodes", "persistentvolumeclaims", "configmaps" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "" ]
    resources: [ "endpoints", "persistentvolumes", "pods" ]
    verbs: [ "*" ]
  - apiGroups: [ "" ]
    resources: [ "events" ]
    verbs: [ "create", "patch" ]
  - apiGroups: [ "storage.k8s.io" ]
    resources: [ "storageclasses" ]
    verbs: [ "get", "list", "watch" ]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      # Tolerate control-plane taints to allow scheduling on control-plane nodes
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Equal
        effect: NoSchedule
      serviceAccountName: local-path-provisioner-service-account
      containers:
        - name: local-path-provisioner
          image: docker.io/kindest/local-path-provisioner:v20240202-8f1494ea
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --helper-image
            - docker.io/kindest/local-path-helper:v20230510-486859a6
            - --config
            - /etc/config/config.json
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard
  namespace: kube-system
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  # nodePathMap, so every PV carries node affinity.
  #
  # This was sharedFileSystemPath, on the premise that "every node mounts the same
  # host directory at /tmp/kinc-storage, so a volume is reachable from any of
  # them". That has not been true since each node got its own storage volume:
  # /tmp/kinc-storage is NAME-storage per node, and across machines it is a
  # different disk entirely. Measured on a six-node cluster, six separate
  # directories with different contents:
  #
  #   machine A   cp1/pv/dynamic: 4   cp3: 2   w-1: 4   w1: 0
  #   machine B   w-1/pv/dynamic: 1   w2: 2
  #
  # A PV with no node affinity on storage that is node-local is a silent data
  # loss: a Pod rescheduled elsewhere mounts an EMPTY directory at the same path
  # and starts over, with no error, no warning and nothing in any event. With
  # affinity it refuses to schedule and says why:
  #
  #   0/7 nodes are available: 1 node(s) didn't match PersistentVolume's node
  #   affinity
  #
  # The path is unchanged, so existing volumes keep working and nothing moves.
  # Only new PVs differ, by carrying the affinity they always should have.
  #
  # The tmpfs worry in the old comment is answered by the path, not by the mode:
  # /tmp/kinc-storage is a mounted volume in every topology kinc builds, so
  # nothing under it is RAM-backed either way.
  config.json: |-
    {
            "nodePathMap": [
                    {
                            "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                            "paths": [
                                    "/tmp/kinc-storage/dynamic"
                            ]
                    }
            ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: docker.io/kindest/local-path-helper:v20230510-486859a6
        imagePullPolicy: IfNotPresent
