# Store the journal on disk rather than in volatile /run.
#
# kinc-init, kinc-preflight and kinc-postinit report what they are doing to the
# journal, and that is the only account of why a cluster did or did not come up.
# With the default Storage=auto the journal stays in /run unless /var/log/journal
# already exists, so a deployment that mounts /var/log from outside still loses
# it. Asking for persistent storage makes journald create the directory and keep
# the log where the operator can read it.
[Journal]
Storage=persistent
