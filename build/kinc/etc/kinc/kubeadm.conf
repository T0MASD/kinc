apiServer:
  # The endpoint a joining node dials, and the loopback kubectl reaches through
  # the published port. A name missing here fails TLS, not discovery, so it
  # presents as an unreachable API rather than a bad certificate.
  certSANs:
  - localhost
  - 127.0.0.1
  - CONTROL_PLANE_NAME_PLACEHOLDER
  extraArgs:
  - name: runtime-config
    value: ""
apiVersion: kubeadm.k8s.io/v1beta4
clusterName: kinc
# What a node INSIDE the cluster dials, so the port is the one the API server
# binds - 6443, always - not the port this cluster is published on. A worker
# resolves this name on the cluster's podman network.
controlPlaneEndpoint: CONTROL_PLANE_ENDPOINT_PLACEHOLDER
controllerManager:
  extraArgs:
  - name: enable-hostpath-provisioner
    value: "true"
kind: ClusterConfiguration
kubernetesVersion: v1.37.0
networking:
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
scheduler: {}
---
apiVersion: kubeadm.k8s.io/v1beta4
# ttl 0s: the token never expires, so a node added or replaced after the
# cluster's first day still joins. The default is 24h.
bootstrapTokens:
- token: abcdef.0123456789abcdef
  ttl: 0s
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: CONTAINER_IP_PLACEHOLDER
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///var/run/crio/crio.sock
  kubeletExtraArgs:
  - name: node-ip
    value: CONTAINER_IP_PLACEHOLDER
  - name: node-labels
    value: ""
  - name: provider-id
    value: kind://podman/kinc/kinc-control-plane
---
apiVersion: kubelet.config.k8s.io/v1beta1
cgroupDriver: cgroupfs
cgroupRoot: /
# Disk only. A memory threshold is omitted because it would measure the host
# rather than the node, and by how much depends on the host.
#
# The kubelet computes memory.available as capacity minus this node's working
# set, where capacity comes from the machine's info - the host's, inside a
# container. Measured exactly: 33332113408 host total, 931127296 working set,
# 32400986112 reported available. So it accounts for neither the node's own
# cgroup limit nor any other node's consumption.
#
# On a host much larger than a node that is useless: a node limited to 4G and
# nearly full still reported 30Gi available, so no threshold would fire. On a
# small dedicated VM, where one node is most of the host, it approximates real
# pressure - still over-reporting by whatever the other nodes are using.
#
# Rather than ship a threshold that means something different on every host,
# the cgroup does the bounding: MemoryHigh throttles and reclaims before
# MemoryMax kills. Anyone running one node on a dedicated VM may reasonably
# add one, knowing it tracks the VM and not the node.
#
# What does bound memory is the cgroup: MemoryHigh throttles and reclaims
# before MemoryMax kills, and both are set on the node's unit when
# KINC_NODE_MEMORY names a size. Reclaim happens instead of eviction.
evictionHard:
  imagefs.available: 0%
  nodefs.available: 0%
  nodefs.inodesFree: 0%
failSwapOn: false
featureGates:
  KubeletInUserNamespace: true
imageGCHighThresholdPercent: 100
kind: KubeletConfiguration
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
conntrack:
  maxPerCore: 0
nftables:
  masqueradeAll: false
  masqueradeBit: 14
  minSyncPeriod: 1s
  syncPeriod: 30s
kind: KubeProxyConfiguration
mode: nftables
