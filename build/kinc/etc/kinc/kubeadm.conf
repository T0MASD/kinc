apiServer:
  # The endpoint a joining node dials, and the loopback kubectl reaches through
  # the published port. A name missing here fails TLS, not discovery, so it
  # presents as an unreachable API rather than a bad certificate.
  certSANs:
  - localhost
  - 127.0.0.1
  - CONTROL_PLANE_NAME_PLACEHOLDER
  extraArgs:
  - name: runtime-config
    value: ""
apiVersion: kubeadm.k8s.io/v1beta4
clusterName: kinc
# What a node INSIDE the cluster dials, so the port is the one the API server
# binds - 6443, always - not the port this cluster is published on. A worker
# resolves this name on the cluster's podman network.
controlPlaneEndpoint: CONTROL_PLANE_ENDPOINT_PLACEHOLDER
controllerManager:
  extraArgs:
  - name: enable-hostpath-provisioner
    value: "true"
kind: ClusterConfiguration
kubernetesVersion: v1.37.0
networking:
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
scheduler: {}
---
apiVersion: kubeadm.k8s.io/v1beta4
# ttl 0s: the token never expires, so a node added or replaced after the
# cluster's first day still joins. The default is 24h.
bootstrapTokens:
- token: abcdef.0123456789abcdef
  ttl: 0s
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: CONTAINER_IP_PLACEHOLDER
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///var/run/crio/crio.sock
  kubeletExtraArgs:
  - name: node-ip
    value: CONTAINER_IP_PLACEHOLDER
  - name: node-labels
    value: ""
  - name: provider-id
    value: kind://podman/kinc/kinc-control-plane
---
apiVersion: kubelet.config.k8s.io/v1beta1
cgroupDriver: cgroupfs
cgroupRoot: /
# Disk only, and no memory threshold, because a memory one cannot work here.
#
# The kubelet derives memory.available from the machine's info, which inside a
# container is the host's. Measured on a node limited to 4G and using 1G of it,
# the kubelet reported 30.7Gi available - the host's figure - while the cgroup
# had about 3Gi left. A threshold like memory.available<500Mi would therefore
# never fire, however tight the node actually was, and would read as a
# safeguard that is not one.
#
# usageBytes is cgroup-aware and available is not, which is what makes the
# combination misleading rather than merely absent.
#
# What does bound memory is the cgroup: MemoryHigh throttles and reclaims
# before MemoryMax kills, and both are set on the node's unit when
# KINC_NODE_MEMORY names a size. Reclaim happens instead of eviction.
evictionHard:
  imagefs.available: 0%
  nodefs.available: 0%
  nodefs.inodesFree: 0%
failSwapOn: false
featureGates:
  KubeletInUserNamespace: true
imageGCHighThresholdPercent: 100
kind: KubeletConfiguration
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
conntrack:
  maxPerCore: 0
nftables:
  masqueradeAll: false
  masqueradeBit: 14
  minSyncPeriod: 1s
  syncPeriod: 30s
kind: KubeProxyConfiguration
mode: nftables
