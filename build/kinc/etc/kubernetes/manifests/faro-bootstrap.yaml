---
apiVersion: v1
kind: Pod
metadata:
  name: faro-bootstrap
  namespace: kube-system
  labels:
    component: faro-bootstrap
    tier: observability
    app.kubernetes.io/name: faro-bootstrap
    app.kubernetes.io/part-of: kinc
spec:
  # Use host network to start before CNI is available
  hostNetwork: true
  
  # High priority to ensure it starts early
  priorityClassName: system-node-critical
  
  containers:
  - name: faro
    # Pinned by digest, because this is a static pod.
    #
    # A tag is resolved at pull time, so with :latest a node that restarts and
    # re-pulls can come back running a different Faro than the one the cluster
    # was built and tested with - and a static pod has no rollout, no history
    # and nothing that records which image it got. kinc-preflight pre-pulls
    # whatever this line names, so pinning here pins both.
    #
    # sha256:6ca4b95c is faro-operator:latest as of 2026-09-25.
    image: ghcr.io/t0masd/faro-operator@sha256:6ca4b95ce496981fa50d8e6a20b5b8a3366381d61f525626c879f86901518f74
    imagePullPolicy: IfNotPresent

    # Wait for API server before starting Faro
    # Two-stage check: TCP port availability (fast) + HTTP healthz (verification)
    # Experiment proved both stages are necessary - TCP-only results in "unknown API groups" errors
    command:
    - /bin/sh
    - -c
    - |
      echo "Waiting for API server port 6443..."
      # Stage 1: Wait for TCP port to be open (nc exits immediately when port is available)
      while ! nc -z 127.0.0.1 6443 2>/dev/null; do 
        sleep 0.1
      done
      echo "Port 6443 open, verifying API server health..."
      
      # Stage 2: Wait for /healthz endpoint to return "ok" (usually ready within 1-2s after port opens)
      # This ensures API discovery is ready and prevents "unknown API groups" errors
      until wget -qO- https://127.0.0.1:6443/healthz --no-check-certificate --timeout=2 2>/dev/null | grep -q "ok"; do 
        sleep 0.2
      done
      
      echo "API server ready, starting Faro..."
      exec /usr/local/bin/faro-operator --config=/etc/faro/config.yaml --log-level=info --output-dir=/var/faro/events
    
    ports:
    - name: metrics
      containerPort: 8080
      protocol: TCP
    
    volumeMounts:
    # Kubeconfig for API server access
    - name: kubeconfig
      mountPath: /etc/kinc/faro/kubeconfig
      readOnly: true
    
    # Faro configuration
    - name: faro-config
      mountPath: /etc/faro
      readOnly: true
    
    # Event storage (in-container for POC)
    - name: faro-events
      mountPath: /var/faro/events
    
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    
    # super-admin.conf, not admin.conf.
    #
    # Faro is a static pod so that it watches from the moment the API server
    # answers, which is before the API server's RBAC bootstrap has made
    # admin.conf's user a cluster-admin. With admin.conf it was denied its first
    # ten list calls - events, daemonsets, storageclasses, pods,
    # persistentvolumes, endpoints - and retried until the binding appeared.
    #
    # super-admin.conf's user is in system:masters, which the API server
    # authorises directly rather than through RBAC, so it is authorised from the
    # first request. This is the same effective access admin.conf grants once
    # RBAC catches up; the difference is only that it does not have to wait.
    # Delaying Faro instead would remove the denials by giving up the window it
    # exists to capture.
    env:
    - name: KUBECONFIG
      value: /etc/kinc/faro/kubeconfig
  
  volumes:
  # Kubeconfig from host
  - name: kubeconfig
    hostPath:
      path: /etc/kinc/faro/kubeconfig
      type: File
  
  # Faro configuration from host
  - name: faro-config
    hostPath:
      path: /etc/faro
      type: Directory
  
  # Event storage (hostPath so we can extract files from host)
  - name: faro-events
    hostPath:
      path: /var/lib/kinc/faro-events
      type: DirectoryOrCreate

