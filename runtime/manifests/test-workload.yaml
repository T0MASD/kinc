# Workload the CI gate deploys to prove storage and networking work.
#
# Storage: a PVC bound by local-path-provisioner, written by one pod and read
# back, so a provisioner that binds but cannot write is still a failure.
#
# Networking: two pods and a Service. The client reaches the server by address
# and by Service name, which exercises the CNI datapath, kube-proxy and CoreDNS
# together. Creating a Service and listing it proves none of those.
#
# agnhost is the upstream e2e image, pinned by tag, and carries both the HTTP
# server and the client in one small image.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kinc-validation
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: kinc-validation
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-server
  namespace: kinc-validation
  labels:
    app: test-server
spec:
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      command: ["/agnhost", "netexec", "--http-port=8080"]
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: data
          mountPath: /data
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 2
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: test-service
  namespace: kinc-validation
spec:
  selector:
    app: test-server
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: test-client
  namespace: kinc-validation
spec:
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      command: ["sleep", "3600"]
