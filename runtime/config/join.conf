# kubeadm join configuration for a worker node.
#
# Complete as written: the CA hash is minted with the cluster before any node
# starts, so a joining node needs nothing from the control plane's filesystem
# and can wait on its own discovery timeout rather than on deploy ordering.
#
# v1beta4 carries the discovery timeout in the top-level timeouts struct.
apiVersion: kubeadm.k8s.io/v1beta4
kind: JoinConfiguration

# Applied after kubeadm downloads the cluster's kubelet-config ConfigMap.
#
# That download is what makes a worker adopt the control plane's settings, so a
# node's own numbers - how much of this machine it may have - have to arrive
# after it. kinc-preflight writes the file; this is where kubeadm looks.
patches:
  directory: /etc/kinc/patches-runtime
timeouts:
  discovery: 20m0s
  tlsBootstrap: 20m0s
discovery:
  bootstrapToken:
    token: abcdef.0123456789abcdef
    apiServerEndpoint: CONTROL_PLANE_ENDPOINT_PLACEHOLDER
    caCertHashes:
    - "sha256:CA_HASH_PLACEHOLDER"
nodeRegistration:
  criSocket: unix:///var/run/crio/crio.sock
  kubeletExtraArgs:
  - name: node-ip
    value: CONTAINER_IP_PLACEHOLDER
  # node-role.kubernetes.io/* is deliberately absent: NodeRestriction rejects
  # every kubernetes.io and k8s.io label a kubelet sets for itself, so the
  # role is applied after registration with the cluster's own credentials.
  - name: node-labels
    value: ""
