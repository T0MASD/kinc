# Turn this node's kubeadm-init into a join.
#
# The unit already carries the ordering, the conditions and the success marker
# a node needs; only the command differs between a node that creates a cluster
# and one that joins it. Replacing ExecStart keeps all of that, and kubeadm's
# own discovery timeout covers waiting for the control plane.
#
# preflight is skipped for the same reason the control plane skips it: those
# checks describe a machine, and this node is a container on one.
[Service]
TimeoutStartSec=25min
ExecStart=
ExecStart=/usr/bin/kubeadm join --config=/etc/kinc/join/join.conf --skip-phases=preflight
