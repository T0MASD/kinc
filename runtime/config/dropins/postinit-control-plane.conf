# A joining CONTROL PLANE installs no cluster-scoped manifests either, but it
# does have one thing to undo.
#
# kubeadm taints every control plane it creates with
# node-role.kubernetes.io/control-plane:NoSchedule. kinc removes that taint
# deliberately - kinc-postinit.sh does `kubectl taint nodes --all ...-` so the
# storage provisioner can be scheduled - but that runs ONCE, on the node that
# ran kubeadm init. A control plane that joins later is tainted by kubeadm and
# nothing removes it, so the cluster ends up with control planes that disagree
# about whether they are schedulable.
#
# The visible symptom is a DaemonSet without a blanket toleration silently
# skipping the joined control planes.
#
# Only the taint is undone here. The CNI, CoreDNS, the storage class and the
# provisioner are the cluster's, already applied by the initialiser, and a
# joining node receives them as workloads from the API it joined - so running
# the whole of kinc-postinit.sh here would re-apply and re-wait for all of it
# for no gain.
#
# Not `|| true`. A taint that is already gone and an API call that failed are
# different outcomes, and swallowing both means a joined control plane can stay
# tainted with nothing anywhere saying so - the same silent-success shape as the
# taint removal that never ran. "already untainted" is fine and says so;
# anything else is reported as a failure.
#
# It warns rather than exits non-zero on purpose: the taint is a scheduling
# problem, not a reason to leave the node half-configured and retrying forever
# if, say, the hostname does not match the registered node name. The line is in
# the journal for `systemctl --user status kinc-postinit` to show.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'n="$(hostname)"; \
  out=$(kubectl --kubeconfig=/etc/kubernetes/admin.conf taint node "$n" \
        node-role.kubernetes.io/control-plane:NoSchedule- 2>&1); rc=$?; \
  if [ $rc -eq 0 ]; then echo "kinc: $out"; \
  elif echo "$out" | grep -q "not found"; then echo "kinc: no control-plane taint on $n, nothing to remove"; \
  else echo "kinc: WARNING could not remove the control-plane taint from $n: $out"; \
       echo "kinc: DaemonSets without a toleration will skip this node"; fi'
