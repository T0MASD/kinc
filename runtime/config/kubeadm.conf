apiServer:
  # The endpoint a joining node dials, and the loopback kubectl reaches through
  # the published port. A name missing here fails TLS, not discovery, so it
  # presents as an unreachable API rather than a bad certificate.
  certSANs:
  - localhost
  - 127.0.0.1
  - CONTROL_PLANE_NAME_PLACEHOLDER
  extraArgs:
  - name: runtime-config
    value: ""
apiVersion: kubeadm.k8s.io/v1beta4
clusterName: kinc
# What a node INSIDE the cluster dials, so the port is the one the API server
# binds - 6443, always - not the port this cluster is published on. A worker
# resolves this name on the cluster's podman network.
controlPlaneEndpoint: CONTROL_PLANE_ENDPOINT_PLACEHOLDER
controllerManager:
  extraArgs:
  - name: enable-hostpath-provisioner
    value: "true"
kind: ClusterConfiguration
kubernetesVersion: v1.37.0
networking:
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
scheduler: {}
---
apiVersion: kubeadm.k8s.io/v1beta4
# ttl 0s: the token never expires, so a node added or replaced after the
# cluster's first day still joins. The default is 24h.
bootstrapTokens:
- token: abcdef.0123456789abcdef
  ttl: 0s
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: CONTAINER_IP_PLACEHOLDER
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///var/run/crio/crio.sock
  kubeletExtraArgs:
  - name: node-ip
    value: CONTAINER_IP_PLACEHOLDER
  - name: node-labels
    value: ""
  - name: provider-id
    value: kind://podman/kinc/kinc-control-plane
---
apiVersion: kubelet.config.k8s.io/v1beta1
cgroupDriver: cgroupfs
cgroupRoot: /
evictionHard:
  imagefs.available: 0%
  nodefs.available: 0%
  nodefs.inodesFree: 0%
failSwapOn: false
featureGates:
  KubeletInUserNamespace: true
imageGCHighThresholdPercent: 100
kind: KubeletConfiguration
# A pod cannot take the machine's pid space away from the others.
#
# Unset, podPidsLimit is -1 and a pod may fork until the kernel's pid_max is
# gone. That is a node-local problem on a dedicated machine and a cross-node one
# here, because every node is a container on the same host and pids are a global
# kernel resource: one pod's runaway starves every other node's kubelet and
# runtime, which fail in ways that look like anything but a pid shortage.
#
# Per pod rather than per node. A cap on the node's own cgroup would bound the
# same thing, but it bounds CRI-O and the kubelet with it, so reaching it breaks
# the node rather than the pod that caused it - and sizing it means guessing a
# total across every pod that might run. This fails the offending container's
# fork with EAGAIN, which surfaces on that pod and nowhere else.
#
# 4096 is what OpenShift ships. It is far above what an ordinary pod uses and
# far below what one needs to hurt the host: at the default 110 pods a node
# totals 450k against a pid_max of 4194304.
podPidsLimit: 4096
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
conntrack:
  maxPerCore: 0
nftables:
  masqueradeAll: false
  masqueradeBit: 14
  minSyncPeriod: 1s
  syncPeriod: 30s
kind: KubeProxyConfiguration
mode: nftables
