name: kinc CI

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets.
  #
  # Filtered to main, a pull request onto another branch got no CI at all - and
  # that is exactly the shape a stacked change takes, where one branch builds on
  # another not yet merged. Such a PR sat green-looking and untested until it was
  # triggered by hand, which is a worse state than failing.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. A push supersedes the run before it, and the earlier one
# is cancelled rather than finishing a suite nobody will read - 27 runs in a day
# of iteration, most of them already stale when they completed.
#
# Not on main or on a tag: those runs are the record of what a commit did, and a
# later push must not delete the evidence for an earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Does the image build, and does a cluster come up, on aarch64. The build has
  # never been architecture-specific - fedora:44 is multi-arch and everything
  # else arrives through dnf - but "should work" is not a test, and a release
  # that publishes an arm64 image needs one before it does.
  #
  # Deliberately narrower than the jobs below: this answers whether the
  # architecture works, not whether a feature does. Those are the same code on
  # either architecture and testing them twice buys little for the runtime.
  #
  # Faro is left off. Its operator image is published for amd64 only, so a
  # pre-pull here would fail for a reason that has nothing to do with kinc. That
  # is also how the fleet runs it - as an operator with its own scheduling, not
  # as this bootstrap static pod.
  test-aarch64:
    runs-on: ubuntu-24.04-arm
    name: Test (aarch64)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System prerequisites check
        run: ./tools/ci-prepare-host.sh
        shell: bash

      - name: Build kinc image
        run: ./tools/build.sh
        shell: bash

      - name: The image is actually arm64
        run: |
          set -euo pipefail
          # Resolved, not named: build.sh carries the tag and bumps it with
          # the Kubernetes version, so a literal here would start passing
          # against nothing the next time that moves.
          img=$(podman images --filter reference='localhost/kinc/node' --format '{{.Repository}}:{{.Tag}}' | head -1)
          [ -n "$img" ] || { echo "::error::build.sh produced no localhost/kinc/node image"; exit 1; }
          echo "  image: $img"
          arch=$(podman image inspect "$img" --format '{{.Architecture}}')
          echo "  built image architecture: $arch"
          [ "$arch" = "arm64" ] || { echo "::error::expected arm64, got $arch"; exit 1; }
        shell: bash

      - name: Deploy cluster (baked-in config)
        run: |
          export CLUSTER_NAME=default
          export USE_BAKED_IN_CONFIG=true
          ./tools/deploy.sh
        shell: bash

      - name: Verify configuration validation
        run: ./tools/ci-verify-init.sh default
        shell: bash

      - name: Extract kubeconfig and validate cluster
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          cluster_port=$(podman inspect kinc-default-control-plane --format '{{range $p, $conf := .NetworkSettings.Ports}}{{range $conf}}{{.HostPort}}{{end}}{{end}}' 2>/dev/null)
          podman cp kinc-default-control-plane:/etc/kubernetes/admin.conf ~/.kube/config
          sed -i "s|server: https://.*:6443|server: https://127.0.0.1:$cluster_port|g" ~/.kube/config
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl get nodes -o wide
          # The node the kubelet registered must agree with the machine it is
          # on. A cluster that comes up on the wrong architecture would still
          # pass every check above.
          got=$(kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.architecture}')
          echo "  node architecture: $got"
          [ "$got" = "arm64" ] || { echo "::error::node reports $got"; exit 1; }
        shell: bash

      - name: Nothing is limited by default
        run: ./tools/ci-verify-node-resources.sh default
        shell: bash

      - name: Collect diagnostics
        if: always()
        run: ./tools/ci-collect-diagnostics.sh default
        shell: bash

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kinc-diagnostics-aarch64
          path: artifacts/diagnostics/
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: CLUSTER_NAME=default ./tools/cleanup.sh
        shell: bash

  test-baked-in:
    runs-on: ubuntu-latest
    name: Test (baked-in config)
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System prerequisites check
        run: ./tools/ci-prepare-host.sh
        shell: bash

      # A repo-wide lint, so it runs once and needs nothing deployed.
      - name: Check for deprecated Kubernetes APIs
        run: ./tools/ci-verify-no-deprecated-apis.sh
        shell: bash

      # The same reason, and the same place: the kubeadm config exists twice
      # and the two jobs below deploy different copies of it, so drift makes
      # them disagree without either one failing.
      - name: Check the two kubeadm configs agree
        run: ./tools/ci-verify-config-drift.sh
        shell: bash

      - name: Build kinc image
        run: |
          echo "=== Building kinc image with multi-service architecture ==="
          ./tools/build.sh
          echo "✅ Image built successfully"
        shell: bash

      - name: Deploy cluster (baked-in config)
        run: |
          echo "=== Deploying cluster with baked-in configuration ==="
          
          export CLUSTER_NAME=default
          export USE_BAKED_IN_CONFIG=true
          export KINC_ENABLE_FARO=true
          # Faro records what changed; audit records what was read. The list is
          # derived from Faro's own config so the two cover the same types and
          # cannot drift - a type watched by one and not the other leaves half
          # the question unanswerable.
          export KINC_AUDIT_RESOURCES="$(./tools/faro-audit-resources.sh)"
          
          # Deploy using systemd-driven approach
          ./tools/deploy.sh
          
          echo "✅ Deployment initiated"
        shell: bash

      - name: Wait for cluster initialization (systemd-driven)
        run: |
          echo "=== Waiting for Cluster Initialization ==="
          echo "Multi-service architecture: kinc-preflight → kubeadm-init → kinc-postinit"
          echo ""
          
          max_wait=300
          waited=0
          
          while [ $waited -lt $max_wait ]; do
            # Check if container is running
            if ! podman ps --format json | jq -e --arg n "kinc-default-control-plane" 'any(.[]; (.Names[]? // "") == $n)' >/dev/null; then
              echo "❌ Container not running"
              systemctl --user status kinc-default-control-plane.service --no-pager || true
              exit 1
            fi
            
            # Check if initialization complete
            if podman exec kinc-default-control-plane test -f /var/lib/kinc-initialized 2>/dev/null; then
              echo "✅ Cluster initialized (${waited}s)"
              break
            fi
            
            # Check if any service failed
            if podman exec kinc-default-control-plane systemctl is-failed --quiet kinc-preflight.service 2>/dev/null || \
               podman exec kinc-default-control-plane systemctl is-failed --quiet kubeadm-init.service 2>/dev/null || \
               podman exec kinc-default-control-plane systemctl is-failed --quiet kinc-postinit.service 2>/dev/null; then
              echo "❌ One or more services failed"
              echo ""
              echo "Service status:"
              podman exec kinc-default-control-plane systemctl status kinc-preflight.service --no-pager || true
              podman exec kinc-default-control-plane systemctl status kubeadm-init.service --no-pager || true
              podman exec kinc-default-control-plane systemctl status kinc-postinit.service --no-pager || true
              exit 1
            fi
            
            if [ $((waited % 30)) -eq 0 ] && [ $waited -gt 0 ]; then
              echo "  Still initializing... (${waited}/${max_wait}s)"
            fi
            
            sleep 5
            waited=$((waited + 5))
          done
          
          if [ $waited -ge $max_wait ]; then
            echo "❌ Timeout waiting for initialization"
            exit 1
          fi
          
          echo ""
          echo "✅ Initialization complete"
        shell: bash

      - name: Verify multi-service architecture
        run: |
          echo "=== Verifying Multi-Service Architecture ==="
          
          # Check all services completed successfully
          echo "Checking kinc-preflight.service..."
          if ! podman exec kinc-default-control-plane systemctl is-active --quiet kinc-preflight.service; then
            echo "❌ kinc-preflight.service not active"
            podman exec kinc-default-control-plane systemctl status kinc-preflight.service --no-pager
            exit 1
          fi
          echo "✅ kinc-preflight.service: active"
          
          echo "Checking kubeadm-init.service..."
          if ! podman exec kinc-default-control-plane systemctl is-active --quiet kubeadm-init.service; then
            echo "❌ kubeadm-init.service not active"
            podman exec kinc-default-control-plane systemctl status kubeadm-init.service --no-pager
            exit 1
          fi
          echo "✅ kubeadm-init.service: active (kubeadm as systemd service)"
          
          echo "Checking kinc-postinit.service..."
          if ! podman exec kinc-default-control-plane systemctl is-active --quiet kinc-postinit.service; then
            echo "❌ kinc-postinit.service not active"
            podman exec kinc-default-control-plane systemctl status kinc-postinit.service --no-pager
            exit 1
          fi
          echo "✅ kinc-postinit.service: active"
          
          # Verify initialization marker
          if ! podman exec kinc-default-control-plane test -f /var/lib/kinc-initialized; then
            echo "❌ Initialization marker not found"
            exit 1
          fi
          echo "✅ Initialization marker: /var/lib/kinc-initialized"
          
          # Verify kubeadm marker
          if ! podman exec kinc-default-control-plane test -f /var/lib/kubeadm-initialized; then
            echo "❌ kubeadm initialization marker not found"
            exit 1
          fi
          echo "✅ kubeadm marker: /var/lib/kubeadm-initialized"
          
          echo ""
          echo "✅ Multi-service architecture verified"
        shell: bash

      - name: Verify baked-in configuration
        run: |
          echo "=== Verifying Baked-In Configuration ==="
          
          # Check kinc-preflight.service logs for config source
          # -o json and jq: grep -oP piped to head -1 exits on the first match,
          # which SIGPIPEs journalctl and fails the pipeline under -o pipefail.
          config_source=$(podman exec kinc-default-control-plane journalctl -u kinc-preflight.service -o json --no-pager --boot 2>/dev/null \
            | jq -r -s '[.[] | (.MESSAGE // "" | tostring)
                        | capture("(?<m>Using mounted configuration|No mounted config found, using baked-in configuration)").m] | first // ""')
          
          echo "Configuration source: $config_source"
          
          if [[ "$config_source" == *"baked-in"* ]]; then
            echo "✅ Using baked-in config as expected"
          else
            echo "❌ NOT using baked-in config"
            echo ""
            echo "kinc-preflight.service logs:"
            podman exec kinc-default-control-plane journalctl -u kinc-preflight.service --no-pager --boot 2>/dev/null || true
            exit 1
          fi
        shell: bash

      - name: Verify configuration validation
        run: ./tools/ci-verify-init.sh default
        shell: bash

      - name: Extract kubeconfig and validate cluster
        run: |
          echo "=== Extracting kubeconfig ==="
          mkdir -p ~/.kube
          
          # Get cluster port
          cluster_port=$(podman inspect kinc-default-control-plane --format '{{range $p, $conf := .NetworkSettings.Ports}}{{range $conf}}{{.HostPort}}{{end}}{{end}}' 2>/dev/null)
          echo "Cluster port: $cluster_port"
          
          # Extract and configure kubeconfig
          podman cp kinc-default-control-plane:/etc/kubernetes/admin.conf ~/.kube/config
          sed -i "s|server: https://.*:6443|server: https://127.0.0.1:$cluster_port|g" ~/.kube/config
          
          echo "✅ Kubeconfig ready"
          echo ""
          
          echo "=== Validating Cluster ==="
          
          echo "Cluster info:"
          kubectl cluster-info
          
          echo ""
          echo "Nodes:"
          kubectl get nodes -o wide
          
          echo ""
          echo "All pods:"
          kubectl get pods -A -o wide
          
          echo ""
          echo "Services:"
          kubectl get svc -A
          
          echo ""
          echo "✅ Cluster validated"
        shell: bash

      # Antrea replaces kindnet, so the gate has to check the datapath rather
      # than infer it. A Pod can be Running with no OVS port behind it, and a
      # Service can resolve while nothing is forwarded: this asks the agent what
      # it did, and traceflow reports each component a packet passed through.
      - name: Validate storage and the Antrea datapath
        run: |
          echo "=== Validating storage and the Antrea datapath ==="

          kubectl apply -f runtime/manifests/test-workload.yaml
          kubectl -n kinc-validation wait --for=jsonpath='{.status.phase}'=Bound pvc/test-pvc --timeout=120s
          kubectl -n kinc-validation wait --for=condition=Ready pod/test-server pod/test-client --timeout=180s

          # Storage: a provisioner that binds but cannot be written to is still a failure.
          echo ""
          echo "--- storage ---"
          kubectl -n kinc-validation exec test-server -- sh -c 'echo kinc-storage-probe > /data/probe.txt'
          read_back=$(kubectl -n kinc-validation exec test-server -- cat /data/probe.txt)
          if [ "$read_back" != "kinc-storage-probe" ]; then
            echo "❌ PVC wrote '$read_back'"
            exit 1
          fi
          echo "✅ PVC bound, written and read back"

          AGENT=$(kubectl -n kube-system get pod -l app=antrea,component=antrea-agent -o name | head -1)

          # Antrea's own view: the agent's health, and an OVS port per Pod. A Pod can be
          # Running with no datapath behind it, so ask the agent rather than the API.
          echo ""
          echo "--- antrea agent ---"
          # All four conditions, not just AgentHealthy: the OVSDB and OpenFlow ones are
          # what report an agent that came up without a working datapath underneath.
          agentinfo=$(kubectl -n kube-system exec "$AGENT" -c antrea-agent -- antctl get agentinfo -o json)
          for cond in AgentHealthy ControllerConnectionUp OVSDBConnectionUp OpenflowConnectionUp; do
            status=$(printf '%s' "$agentinfo" | jq -r --arg c "$cond" '.agentConditions[]? | select(.type==$c) | .status')
            if [ "$status" != "True" ]; then
              echo "❌ $cond is '$status'"
              printf '%s' "$agentinfo" | jq -r '.agentConditions[]? | "   \(.type)=\(.status)"'
              exit 1
            fi
            echo "✅ $cond"
          done

          for pod in test-server test-client; do
            ofport=$(kubectl -n kube-system exec "$AGENT" -c antrea-agent -- \
              antctl get podinterface "$pod" -n kinc-validation -o json | jq -r '.[0].ofPort // empty')
            if [ -z "$ofport" ]; then
              echo "❌ $pod has no OVS port"
              exit 1
            fi
            echo "✅ $pod on OVS port $ofport"
          done

          # Traceflow reports what the datapath did with a packet, per component. It is
          # how a CNI change is checked: a Service that resolves and a Pod that is Ready
          # say nothing about whether traffic is actually forwarded.
          trace() {
            local desc="$1" dst="$2" flow="$3" want="$4"
            local out
            out=$(kubectl -n kube-system exec "$AGENT" -c antrea-agent -- \
                  antctl traceflow -S kinc-validation/test-client -D "$dst" -f "$flow" -o json 2>/dev/null)
            if ! printf '%s' "$out" | jq -e --arg w "$want" \
                 '.phase == "Succeeded" and ([.results[].observations[].action] | index($w) != null)' >/dev/null; then
              echo "❌ $desc: expected a '$want' observation"
              printf '%s' "$out" | jq -r '"   phase=\(.phase)", (.results[]?.observations[]? | "   \(.component) -> \(.action)")' || true
              exit 1
            fi
            echo "✅ $desc"
            printf '%s' "$out" | jq -r '.results[].observations[] | "     \(.component)\(if .componentInfo then "/"+.componentInfo else "" end) -> \(.action)"'
          }

          echo ""
          echo "--- datapath ---"
          CLUSTER_IP=$(kubectl -n kinc-validation get svc test-service -o jsonpath='{.spec.clusterIP}')
          trace "east/west: pod to pod"          kinc-validation/test-server tcp,tcp_dst=8080 Delivered
          trace "service: pod to ClusterIP"      "$CLUSTER_IP"               tcp,tcp_dst=8080 Delivered
          trace "north/south: pod to external"   8.8.8.8                     icmp             ForwardedOutOfNetwork

          # Traceflow injects a synthetic packet. Real traffic also needs CoreDNS and the
          # Service proxy, so send some.
          echo ""
          echo "--- live traffic ---"
          kubectl -n kinc-validation exec test-client -- /agnhost connect --timeout=15s test-service:8080
          echo "✅ pod reached the Service by name"

          kubectl delete -f runtime/manifests/test-workload.yaml --wait=false
          echo ""
          echo "✅ storage and datapath validated"

      # Enabling audit without asserting it is the failure this gate exists for:
      # a policy that matches nothing writes an empty log and looks identical to
      # a working one. This reads the audited resources and requires the entries,
      # then reads an unaudited one and requires its absence.
      - name: Validate API-server audit
        run: |
          # This job writes its kubeconfig to ~/.kube/config, kubectl's default.
          # Pointing at kinc-default-config instead left every read failing, and
          # the gate passed anyway because other components read the same
          # resources constantly - so the entries it looked for were always
          # there, put in the log by someone else.
          ./tools/ci-verify-audit.sh default /pods /configmaps apps/deployments
        shell: bash

      # A component still logging at error level once the cluster has settled
      # is failing at something no other gate here sees. Startup errors are
      # expected and excluded by the window, not by an allowlist.
      # Faro reports success by being applied, not by working. Its pod can die
      # a second later and the deploy never knows - which is what happened when
      # runAsUser started being honoured and Faro could no longer write its
      # hostPath. It captured nothing, and CI stayed green.
      - name: Verify Faro is capturing
        run: ./tools/ci-verify-faro.sh default
        shell: bash

      # The default path: no limits asked for, so none may exist.
      #
      # This is the direction that matters for everyone who sets nothing, and
      # it needs a job that sets nothing to assert it. test-multi-node used to
      # carry it and now runs limited, so it moved here rather than being lost
      # - a limit leaking in where none was asked for would otherwise show up
      # nowhere.
      - name: Verify nothing is limited by default
        run: ./tools/ci-verify-node-resources.sh default
        shell: bash

      - name: Collect diagnostics
        if: always()
        run: ./tools/ci-collect-diagnostics.sh default
        shell: bash

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kinc-diagnostics-baked-in-${{ github.run_number }}
          path: artifacts/
          # .captured-at records when observation ended, and every later
          # reading of this capture measures "how long has this class been
          # quiet" against it. upload-artifact drops dotfiles unless told
          # otherwise, so a downloaded capture fell back to its newest log
          # line - a floor on the end, not the end, which throws away real
          # quiet and makes the same artifact answer differently later.
          include-hidden-files: true
          retention-days: 30

      - name: Extract Faro events
        if: always()
        run: ./tools/ci-collect-faro.sh default
        shell: bash

      - name: Upload Faro events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: faro-events-baked-in-${{ github.run_number }}
          path: artifacts/faro/
          retention-days: 30

      - name: Collect audit log
        if: always()
        run: ./tools/ci-collect-audit.sh default
        shell: bash

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-log-baked-in-${{ github.run_number }}
          path: artifacts/audit/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          echo "=== Cleaning up ==="
          ./tools/cleanup.sh default || true
          systemctl --user reset-failed || true
          echo "✅ Cleanup complete"
        shell: bash
      # The analysis phase: every check that reads the capture, after teardown.
      # What belongs here and why is in the script - briefly, a question like
      # "has this stopped?" cannot be answered against a cluster that is still
      # writing, and a component's own log never reaches this console at all.
      - name: Analyse capture
        if: always()
        run: ./tools/ci-analyse-capture.sh default
        shell: bash


      # Separate from the diagnostics upload, which ran before teardown: the
      # summary is written after it and would otherwise miss the artifact.
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-summary-baked-in-${{ github.run_number }}
          path: artifacts/summary/
          retention-days: 30


  test-multi-node:
    runs-on: ubuntu-latest
    # Resources are a property of this suite, not a job of their own.
    #
    # They used to be set in one job that ran nothing else - no faro, no audit,
    # no restart - so every interaction between a limit and the rest of kinc
    # was untested. Setting them here covers the one that matters most: this is
    # the only job that restarts a cluster, and whether node units keep their
    # limits across a stop/start is exactly the kind of thing that degrades
    # quietly.
    #
    # Nodes that may each reach 6G and 2 cores, inside a cluster capped below
    # the sum of them. test-baked-in stays unlimited and asserts that, so the
    # default path - what `kinc up` gives you - keeps its own coverage.
    env:
      KINC_NODE_MEMORY: 6G
      KINC_NODE_CPUS: 2
      KINC_CLUSTER_MEMORY: 10G
      KINC_CLUSTER_CPUS: 3
    name: Test (multi-node)

    steps:



      - name: Checkout
        uses: actions/checkout@v7

      - name: System prerequisites check
        run: ./tools/ci-prepare-host.sh
        shell: bash

      - name: Build kinc image
        run: |
          echo "=== Building kinc image ==="
          ./tools/build.sh
          echo "✅ Image built successfully"
        shell: bash

      # A control plane and one worker. A second worker proves nothing the
      # first does not: what is under test is whether pod traffic leaves a
      # node at all, and one tunnel shows that.
      - name: Deploy a two-node cluster
        run: |
          echo "=== Deploying a control plane and one worker ==="
          export CLUSTER_NAME=default
          export KINC_WORKERS=1
          export KINC_ENABLE_FARO=true
          # Derived from Faro's config so the two cover the same types.
          export KINC_AUDIT_RESOURCES="$(./tools/faro-audit-resources.sh)"
          ./tools/deploy.sh
        shell: bash

      - name: Verify configuration validation
        run: ./tools/ci-verify-init.sh default
        shell: bash

      - name: Extract kubeconfig
        run: |
          mkdir -p ~/.kube
          podman exec kinc-default-control-plane cat /etc/kubernetes/admin.conf > ~/.kube/config
          sed -i 's|server: https://.*:6443|server: https://127.0.0.1:6443|g' ~/.kube/config
          kubectl get nodes -o wide
        shell: bash

      # Antrea's geneve tunnel is what makes a second node possible, and it is
      # the one thing a single-node cluster can never exercise. Both probes are
      # pinned to a node on purpose; the gate asserts the placement rather than
      # trusting the scheduler to have honoured it.
      - name: Validate traffic across nodes
        run: |
          kubectl apply -f runtime/manifests/test-workload.yaml
          kubectl apply -f runtime/manifests/test-workload-crossnode.yaml
          ./tools/ci-verify-crossnode.sh kinc-default-control-plane kinc-default-w1
        shell: bash

      # Audit flags being set proves nothing: a policy that matches no resource
      # writes an empty log and looks the same as a working one. This reads the
      # audited resources and requires the entries to appear, then reads one that
      # is not audited and requires that it does not.
      - name: Validate API-server audit
        run: ./tools/ci-verify-audit.sh default /pods /configmaps apps/deployments
        shell: bash

      # A component still logging at error level once the cluster has settled
      # is failing at something no other gate here sees. Startup errors are
      # expected and excluded by the window, not by an allowlist.
      # Faro reports success by being applied, not by working. Its pod can die
      # a second later and the deploy never knows - which is what happened when
      # runAsUser started being honoured and Faro could no longer write its
      # hostPath. It captured nothing, and CI stayed green.
      - name: Verify Faro is capturing
        run: ./tools/ci-verify-faro.sh default
        shell: bash

      - name: Collect diagnostics
        if: always()
        run: ./tools/ci-collect-diagnostics.sh default
        shell: bash

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kinc-diagnostics-multi-node-${{ github.run_number }}
          path: artifacts/
          # .captured-at records when observation ended, and every later
          # reading of this capture measures "how long has this class been
          # quiet" against it. upload-artifact drops dotfiles unless told
          # otherwise, so a downloaded capture fell back to its newest log
          # line - a floor on the end, not the end, which throws away real
          # quiet and makes the same artifact answer differently later.
          include-hidden-files: true
          retention-days: 30

      - name: Extract Faro events
        if: always()
        run: ./tools/ci-collect-faro.sh default
        shell: bash

      - name: Upload Faro events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: faro-events-multi-node-${{ github.run_number }}
          path: artifacts/faro/
          retention-days: 30

      - name: Collect audit log
        if: always()
        run: ./tools/ci-collect-audit.sh default
        shell: bash

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-log-multi-node-${{ github.run_number }}
          path: artifacts/audit/
          retention-days: 30

      # Asserts the limits this job's env asked for: enforced on each node's
      # unit and on the cluster slice, and advertised to the scheduler as
      # allocatable less each node's own reserve.
      #
      # This used to assert the opposite - that nothing was limited - on the
      # grounds that a runner was too small to fit two limited nodes. It is not:
      # the same runner carries the dedicated resources job's two 5G nodes, so
      # the reason the limited path was skipped here was measured on hardware
      # that is no longer what CI runs on.
      - name: Verify node resources are enforced and advertised
        run: ./tools/ci-verify-node-resources.sh default
        shell: bash

      # Last, and before teardown, so every capture above describes a cluster
      # that had not been restarted - and so the thing being tested is the
      # second boot, which no other job reaches. Only here: this is the job
      # with both a control plane and a worker, and they fail the same way.
      - name: Verify the cluster survives a restart
        run: ./tools/ci-verify-restart.sh default
        shell: bash

      # The same assertion again, on the other side of the restart.
      #
      # The gate above ran against a cluster that had never been restarted, and
      # ci-verify-restart.sh checks addresses, readiness and kube-system - it
      # says nothing about limits. So whether a node unit keeps its MemoryHigh
      # and CPUQuota, and whether the slice keeps its own, across a stop/start
      # was asserted nowhere. Re-running it here costs no deploy and is the
      # reason this job carries the limits at all.
      - name: Verify node resources survived the restart
        run: ./tools/ci-verify-node-resources.sh default
        shell: bash

      - name: Cleanup
        if: always()
        run: |
          CLUSTER_NAME=default ./tools/cleanup.sh || true
          systemctl --user reset-failed || true
        shell: bash
      # The analysis phase: every check that reads the capture, after teardown.
      # What belongs here and why is in the script - briefly, a question like
      # "has this stopped?" cannot be answered against a cluster that is still
      # writing, and a component's own log never reaches this console at all.
      - name: Analyse capture
        if: always()
        run: ./tools/ci-analyse-capture.sh default
        shell: bash


      # Separate from the diagnostics upload, which ran before teardown: the
      # summary is written after it and would otherwise miss the artifact.
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-summary-multi-node-${{ github.run_number }}
          path: artifacts/summary/
          retention-days: 30


  test-mounted:
    runs-on: ubuntu-latest
    name: Test (mounted config)
    
    steps:



      - name: Checkout
        uses: actions/checkout@v7

      - name: System prerequisites check
        run: ./tools/ci-prepare-host.sh
        shell: bash

      - name: Build kinc image
        run: |
          echo "=== Building kinc image with multi-service architecture ==="
          ./tools/build.sh
          echo "✅ Image built successfully"
        shell: bash

      - name: Deploy clusters (mounted config)
        run: |
          echo "=== Deploying 2 clusters with mounted configuration ==="
          echo "This demonstrates multi-cluster capability with mounted configs"
          echo ""
          
          # Deploy cluster 1, with audit. The list is derived from Faro's config
          # so the two cover the same types and cannot drift.
          echo "Deploying cluster: default (port 6443)"
          export CLUSTER_NAME=default
          export KINC_ENABLE_FARO=true
          export KINC_AUDIT_RESOURCES="$(./tools/faro-audit-resources.sh)"
          ./tools/deploy.sh
          echo "✅ Cluster 'default' deployment initiated"
          echo ""

          # Deploy cluster 2 WITHOUT audit, deliberately.
          #
          # Audit is opt-in, and every other cluster in CI turns it on - so
          # nothing would catch a change that made it always-on. This is the
          # control for that: the same image, the variable unset, and a gate
          # that requires no policy, no flags and no log. It also shows audit is
          # per cluster rather than per image.
          echo "Deploying cluster: cluster01 (port 6444) - audit deliberately off"
          unset KINC_AUDIT_RESOURCES
          export CLUSTER_NAME=cluster01
          export KINC_ENABLE_FARO=true
          ./tools/deploy.sh
          echo "✅ Cluster 'cluster01' deployment initiated"
          echo ""
          
          echo "✅ Both cluster deployments initiated"
        shell: bash

      - name: Wait for clusters initialization (systemd-driven)
        run: |
          echo "=== Waiting for Both Clusters Initialization ==="
          echo "Multi-service architecture: kinc-preflight → kubeadm-init → kinc-postinit"
          echo ""
          
          for cluster in default cluster01; do
            echo "Waiting for cluster: $cluster"
            max_wait=300
            waited=0
            
            while [ $waited -lt $max_wait ]; do
              # Check if container is running
              if ! podman ps --format json | jq -e --arg n "kinc-${cluster}-control-plane" 'any(.[]; (.Names[]? // "") == $n)' >/dev/null; then
                echo "❌ Container not running: kinc-${cluster}-control-plane"
                systemctl --user status kinc-${cluster}-control-plane.service --no-pager || true
                exit 1
              fi
              
              # Check if initialization complete
              if podman exec kinc-${cluster}-control-plane test -f /var/lib/kinc-initialized 2>/dev/null; then
                echo "✅ Cluster '$cluster' initialized (${waited}s)"
                break
              fi
              
              # Check if any service failed
              if podman exec kinc-${cluster}-control-plane systemctl is-failed --quiet kinc-preflight.service 2>/dev/null || \
                 podman exec kinc-${cluster}-control-plane systemctl is-failed --quiet kubeadm-init.service 2>/dev/null || \
                 podman exec kinc-${cluster}-control-plane systemctl is-failed --quiet kinc-postinit.service 2>/dev/null; then
                echo "❌ One or more services failed in cluster '$cluster'"
                echo ""
                echo "Service status:"
                podman exec kinc-${cluster}-control-plane systemctl status kinc-preflight.service --no-pager || true
                podman exec kinc-${cluster}-control-plane systemctl status kubeadm-init.service --no-pager || true
                podman exec kinc-${cluster}-control-plane systemctl status kinc-postinit.service --no-pager || true
                exit 1
              fi
              
              if [ $((waited % 30)) -eq 0 ] && [ $waited -gt 0 ]; then
                echo "  Still initializing cluster '$cluster'... (${waited}/${max_wait}s)"
              fi
              
              sleep 5
              waited=$((waited + 5))
            done
            
            if [ $waited -ge $max_wait ]; then
              echo "❌ Timeout waiting for cluster '$cluster' initialization"
              exit 1
            fi
            
            echo ""
          done
          
          echo "✅ Both clusters initialized successfully"
        shell: bash

      - name: Verify multi-service architecture (both clusters)
        run: |
          echo "=== Verifying Multi-Service Architecture (Both Clusters) ==="
          
          for cluster in default cluster01; do
            echo ""
            echo "Checking cluster: $cluster"
            
            # Check all services completed successfully
            echo "Checking kinc-preflight.service..."
            if ! podman exec kinc-${cluster}-control-plane systemctl is-active --quiet kinc-preflight.service; then
              echo "❌ kinc-preflight.service not active in cluster '$cluster'"
              podman exec kinc-${cluster}-control-plane systemctl status kinc-preflight.service --no-pager
              exit 1
            fi
            echo "✅ kinc-preflight.service: active"
            
            echo "Checking kubeadm-init.service..."
            if ! podman exec kinc-${cluster}-control-plane systemctl is-active --quiet kubeadm-init.service; then
              echo "❌ kubeadm-init.service not active in cluster '$cluster'"
              podman exec kinc-${cluster}-control-plane systemctl status kubeadm-init.service --no-pager
              exit 1
            fi
            echo "✅ kubeadm-init.service: active (kubeadm as systemd service)"
            
            echo "Checking kinc-postinit.service..."
            if ! podman exec kinc-${cluster}-control-plane systemctl is-active --quiet kinc-postinit.service; then
              echo "❌ kinc-postinit.service not active in cluster '$cluster'"
              podman exec kinc-${cluster}-control-plane systemctl status kinc-postinit.service --no-pager
              exit 1
            fi
            echo "✅ kinc-postinit.service: active"
            
            # Verify initialization marker
            if ! podman exec kinc-${cluster}-control-plane test -f /var/lib/kinc-initialized; then
              echo "❌ Initialization marker not found in cluster '$cluster'"
              exit 1
            fi
            echo "✅ Initialization marker: /var/lib/kinc-initialized"
            
            # Verify kubeadm marker
            if ! podman exec kinc-${cluster}-control-plane test -f /var/lib/kubeadm-initialized; then
              echo "❌ kubeadm initialization marker not found in cluster '$cluster'"
              exit 1
            fi
            echo "✅ kubeadm marker: /var/lib/kubeadm-initialized"
            
            echo "✅ Cluster '$cluster': Multi-service architecture verified"
          done
          
          echo ""
          echo "✅ Multi-service architecture verified for both clusters"
        shell: bash

      - name: Verify mounted configuration (both clusters)
        run: |
          echo "=== Verifying Mounted Configuration (Both Clusters) ==="
          
          for cluster in default cluster01; do
            echo ""
            echo "Checking cluster: $cluster"
            
            # Check kinc-preflight.service logs for config source
            # -o json and jq: grep -oP piped to head -1 exits on the first match,
            # which SIGPIPEs journalctl and fails the pipeline under -o pipefail.
            config_source=$(podman exec kinc-${cluster}-control-plane journalctl -u kinc-preflight.service -o json --no-pager --boot 2>/dev/null \
              | jq -r -s '[.[] | (.MESSAGE // "" | tostring)
                          | capture("(?<m>Using mounted configuration|No mounted config found, using baked-in configuration)").m] | first // ""')
            
            echo "Configuration source: $config_source"
            
            if [[ "$config_source" == *"mounted"* ]]; then
              echo "✅ Cluster '$cluster': Using mounted config as expected"
            else
              echo "❌ Cluster '$cluster': NOT using mounted config"
              echo ""
              echo "kinc-preflight.service logs:"
              podman exec kinc-${cluster}-control-plane journalctl -u kinc-preflight.service --no-pager --boot 2>/dev/null || true
              exit 1
            fi
          done
          
          echo ""
          echo "✅ Both clusters using mounted configuration"
        shell: bash

      - name: Verify configuration validation (both clusters)
        run: ./tools/ci-verify-init.sh default cluster01
        shell: bash

      - name: Extract kubeconfig and validate clusters
        run: |
          echo "=== Extracting kubeconfig and Validating Both Clusters ==="
          mkdir -p ~/.kube
          
          for cluster in default cluster01; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Cluster: $cluster"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Get cluster port
            cluster_port=$(podman inspect kinc-${cluster}-control-plane --format '{{range $p, $conf := .NetworkSettings.Ports}}{{range $conf}}{{.HostPort}}{{end}}{{end}}' 2>/dev/null)
            echo "Cluster port: $cluster_port"
            
            # Extract and configure kubeconfig
            podman cp kinc-${cluster}-control-plane:/etc/kubernetes/admin.conf ~/.kube/kinc-${cluster}-config
            sed -i "s|server: https://.*:6443|server: https://127.0.0.1:$cluster_port|g" ~/.kube/kinc-${cluster}-config
            
            echo "✅ Kubeconfig ready: ~/.kube/kinc-${cluster}-config"
            echo ""
            
            export KUBECONFIG=~/.kube/kinc-${cluster}-config
            
            echo "Cluster info:"
            kubectl cluster-info
            
            echo ""
            echo "Nodes:"
            kubectl get nodes -o wide
            
            echo ""
            echo "All pods:"
            kubectl get pods -A -o wide
            
            echo ""
            echo "Services:"
            kubectl get svc -A
            
            echo ""
            echo "✅ Cluster '$cluster' validated"
          done
          
          echo ""
          echo "✅ Both clusters validated successfully"
        shell: bash

      # Both clusters: audit is per API server, so one passing says nothing
      # about the other.
      - name: Validate API-server audit (on, and off)
        run: |
          echo "-- default: audit enabled"
          export KUBECONFIG=~/.kube/kinc-default-config
          ./tools/ci-verify-audit.sh default /pods /configmaps apps/deployments

          echo ""
          echo "-- cluster01: audit deliberately off"
          ./tools/ci-verify-audit-off.sh cluster01
        shell: bash

      # A component still logging at error level once the cluster has settled
      # is failing at something no other gate here sees. Startup errors are
      # expected and excluded by the window, not by an allowlist.
      # Faro reports success by being applied, not by working. Its pod can die
      # a second later and the deploy never knows - which is what happened when
      # runAsUser started being honoured and Faro could no longer write its
      # hostPath. It captured nothing, and CI stayed green.
      - name: Verify Faro is capturing
        run: ./tools/ci-verify-faro.sh default cluster01
        shell: bash

      - name: Collect diagnostics
        if: always()
        run: ./tools/ci-collect-diagnostics.sh default cluster01
        shell: bash

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kinc-diagnostics-mounted-${{ github.run_number }}
          path: artifacts/
          # .captured-at records when observation ended, and every later
          # reading of this capture measures "how long has this class been
          # quiet" against it. upload-artifact drops dotfiles unless told
          # otherwise, so a downloaded capture fell back to its newest log
          # line - a floor on the end, not the end, which throws away real
          # quiet and makes the same artifact answer differently later.
          include-hidden-files: true
          retention-days: 30

      - name: Extract Faro events from both clusters
        if: always()
        run: ./tools/ci-collect-faro.sh default cluster01
        shell: bash

      - name: Upload Faro events
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: faro-events-mounted-${{ github.run_number }}
          path: artifacts/faro/
          retention-days: 30

      - name: Collect audit log
        if: always()
        run: ./tools/ci-collect-audit.sh default cluster01
        shell: bash

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-log-mounted-${{ github.run_number }}
          path: artifacts/audit/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          echo "=== Cleaning up both clusters ==="
          ./tools/cleanup.sh default || true
          ./tools/cleanup.sh cluster01 || true
          systemctl --user reset-failed || true
          echo "✅ Cleanup complete"
        shell: bash
      # The analysis phase: every check that reads the capture, after teardown.
      # What belongs here and why is in the script - briefly, a question like
      # "has this stopped?" cannot be answered against a cluster that is still
      # writing, and a component's own log never reaches this console at all.
      - name: Analyse capture
        if: always()
        run: ./tools/ci-analyse-capture.sh default cluster01
        shell: bash


      # Separate from the diagnostics upload, which ran before teardown: the
      # summary is written after it and would otherwise miss the artifact.
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-summary-mounted-${{ github.run_number }}
          path: artifacts/summary/
          retention-days: 30

  # Every shape resource limits can take, each deployed and asserted.
  #
  # They are different policies, not degrees of one:
  #
  #   per-node only      each node bounded, the total is not - two 4G nodes can
  #                      want 8G of a 7G host
  #   per-cluster only   the total bounded, the nodes are not - one node can
  #                      starve another
  #   both, cluster <    each node may burst to its limit while together they
  #   the sum of nodes   may not exceed the cluster's. This is the one a small
  #                      VM wants, and it was refused as contradictory until a
  #                      review pointed out it is the point.
  #
  # Three deploys in one job rather than three jobs, because they share a build
  # and differ only in environment.
  #
  # Memory throughout, not CPU. A runner has 2 vCPU, so a per-node CPU limit is
  # either a no-op at 2 or ruinous below it: measured, a control plane capped at
  # one core was still running kubeadm init after 21 minutes, with 165 throttle
  # events. Memory limits of 5G sit above what a node uses - measured 2.9G and
  # 1.2G idle - and below the host, which exercises the arithmetic without
  # anything throttling.
  #
  # Each phase runs on a mounted config, which is the default path, so the
  # KubeletConfiguration preflight patches comes from a file rather than the
  # image.
  # The limit shapes, in parallel.
  #
  # These were five deploys in one job, run one after another, and that job was
  # the whole suite's critical path at 12m37s against the next slowest at 5m10s.
  # Nothing about them is sequential: each is an independent cluster with its own
  # limits, and the only reason they shared a job is that they were written as
  # phases of one.
  test-node-resources:
    name: Test (resources, ${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      # Every shape is reported, rather than the first failure hiding the rest.
      fail-fast: false
      matrix:
        include:
          - scenario: per-node
            limits: KINC_WORKERS=1 KINC_NODE_MEMORY=5G KINC_NODE_CPUS=2
            crossnode: 'yes'
          - scenario: per-cluster
            limits: KINC_WORKERS=1 KINC_CLUSTER_MEMORY=6G KINC_CLUSTER_CPUS=3
            crossnode: 'no'
          # Two nodes that may each reach 5G, inside a cluster capped at 6G.
          # Overcommit with an aggregate ceiling, which is the combination worth
          # having and the one that used to be refused as contradictory.
          - scenario: cluster-below-sum
            limits: KINC_WORKERS=1 KINC_NODE_MEMORY=5G KINC_NODE_CPUS=2 KINC_CLUSTER_MEMORY=6G KINC_CLUSTER_CPUS=3
            crossnode: 'no'
          # A control plane's static pods request 650m a worker never carries, so
          # an even split runs it far closer to its ceiling than the number says.
          - scenario: weighted-per-role
            limits: KINC_WORKERS=1 KINC_CONTROL_PLANE_MEMORY=5G KINC_CONTROL_PLANE_CPUS=3 KINC_WORKER_MEMORY=3G KINC_WORKER_CPUS=1.5
            crossnode: 'no'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System prerequisites check
        run: ./tools/ci-prepare-host.sh
        shell: bash

      - name: Build kinc image
        run: ./tools/build.sh
        shell: bash

      - name: Deploy and verify
        run: |
          set -euo pipefail
          export ${{ matrix.limits }}
          ./tools/deploy.sh
          ./tools/ci-verify-init.sh default
          ./tools/ci-verify-node-resources.sh default
        shell: bash

      # Only where nodes are limited rather than the cluster: the question is
      # whether a per-node cgroup limit leaves the geneve datapath alone.
      - name: Traffic still crosses nodes
        if: matrix.crossnode == 'yes'
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          podman exec kinc-default-control-plane cat /etc/kubernetes/admin.conf \
            | sed "s|server: https://.*:6443|server: https://127.0.0.1:6443|" > ~/.kube/config
          # Both: test-workload.yaml carries the kinc-validation Namespace that
          # the cross-node manifest's pods are created in.
          kubectl apply -f runtime/manifests/test-workload.yaml
          kubectl apply -f runtime/manifests/test-workload-crossnode.yaml
          ./tools/ci-verify-crossnode.sh kinc-default-control-plane kinc-default-w1
        shell: bash

      - name: Collect diagnostics
        if: always()
        run: ./tools/ci-collect-diagnostics.sh default
        shell: bash

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kinc-diagnostics-resources-${{ matrix.scenario }}-${{ github.run_number }}
          path: artifacts/diagnostics/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: ./tools/cleanup.sh
        shell: bash

      - name: Analyse capture
        if: always()
        run: ./tools/ci-analyse-capture.sh default
        shell: bash

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-resources-${{ matrix.scenario }}-${{ github.run_number }}
          path: artifacts/summary/
          if-no-files-found: warn

  # Clusters that already exist, which no other job covers.
  #
  # Each leg builds a cluster and then does something to that same cluster, so
  # each is internally sequential - but they are independent of one another, and
  # running them in one job made it the suite's critical path at 8m once the
  # limit shapes were parallelised. A matrix costs three image builds to buy
  # back half the wall clock.
  #
  # All three restart a node, and the capture is taken afterwards, so the
  # components in it are as old as the restart rather than as old as the
  # cluster. The analysis still runs: the component-log gate reports a run where
  # nothing was judgeable as a failure rather than a pass, which is what stops
  # it going quietly inert.
  test-resumed-clusters:
    name: Test (resumed, ${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # A limit given to a cluster that already exists. The provisioning
          # that makes a node advertise honestly used to be gated on a marker on
          # a volume, so a resumed cluster kept whatever it was born with.
          - scenario: adopts-a-new-limit
            gate: ./tools/ci-verify-resumed-adoption.sh default

          # A cluster created by the previous release, resumed onto this build.
          #
          # Created by the old image, not merely run on it: a sibling derived
          # from this tree has its state written by current provisioning however
          # the restart goes, and the bugs worth catching are the opposite -
          # an events directory created root-owned before the install -d line
          # existed, a kubeconfig never staged because init predated the unit
          # that stages it, reservations absent because nothing rendered them.
          # Deploying current and downgrading would prove nothing.
          #
          # Pinned by digest. Version tags are written once and do not move, but
          # the pin costs nothing and removes the assumption. It ageing is a
          # feature: a more distant release means more accumulated difference,
          # so there is no hurry to bump it.
          - scenario: upgrade-from-previous-release
            setup: |
              PREV=ghcr.io/t0masd/kinc@sha256:a68f8f88d08ac566de1712cec94c0a417ad3cb92e0b462f9a8322ec991df101c
              echo "::notice::upgrading from ${PREV} (v1.37.0-3)"
              KINC_IMAGE="$PREV" KINC_WORKERS=0 KINC_NODE_MEMORY=5G KINC_ENABLE_FARO=true ./tools/deploy.sh
            gate: ./tools/ci-verify-image-change-restart.sh default localhost/kinc/node:v1.37.0

          # The mechanism on its own: a sibling image differing only in a value a
          # provisioning step renders, so what the assertion sees can come from
          # nothing else.
          - scenario: new-image-configuration
            setup: |
              export KINC_WORKERS=0 KINC_NODE_MEMORY=5G
              ./tools/deploy.sh
            gate: ./tools/ci-verify-image-change-restart.sh default

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: System prerequisites check
        run: ./tools/ci-prepare-host.sh
        shell: bash

      - name: Build kinc image
        run: ./tools/build.sh
        shell: bash

      - name: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          ./tools/cleanup.sh default || true
          ${{ matrix.setup }}
          ${{ matrix.gate }}
        shell: bash

      - name: Collect diagnostics
        if: always()
        run: ./tools/ci-collect-diagnostics.sh default
        shell: bash

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kinc-diagnostics-resumed-${{ matrix.scenario }}-${{ github.run_number }}
          path: artifacts/diagnostics/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: ./tools/cleanup.sh
        shell: bash

      - name: Analyse capture
        if: always()
        run: ./tools/ci-analyse-capture.sh default
        shell: bash

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-resumed-${{ matrix.scenario }}-${{ github.run_number }}
          path: artifacts/summary/
          if-no-files-found: warn
